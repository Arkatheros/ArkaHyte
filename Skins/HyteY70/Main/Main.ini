[Rainmeter]
Update=1000
AccurateText=1
DefaultUpdateDivider=1

[Metadata]
Name=HyteY70
Author=vilai
Information=Full-screen system monitor for the HYTE Y70 Touch case display (682x2560 portrait).
Version=0.1.0
License=MIT

@Include=#@#Variables.inc

; ===================================================================
; Measures - native
; ===================================================================

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A %#d %B
FormatLocale=Local

[MeasureUptime]
Measure=Uptime
Format=%4!i!d %3!02i!h %2!02i!m
UpdateDivider=30

[MeasureCpu]
Measure=CPU
Processor=0
MinValue=0
MaxValue=100

[MeasureRamUsed]
Measure=PhysicalMemory

[MeasureRamTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

[MeasureDisk1Used]
Measure=FreeDiskSpace
Drive=#Drive1#
InvertMeasure=1
UpdateDivider=30

[MeasureDisk1Total]
Measure=FreeDiskSpace
Drive=#Drive1#
Total=1
UpdateDivider=-1

[MeasureDisk2Used]
Measure=FreeDiskSpace
Drive=#Drive2#
InvertMeasure=1
UpdateDivider=30

[MeasureDisk2Total]
Measure=FreeDiskSpace
Drive=#Drive2#
Total=1
UpdateDivider=-1

; ===================================================================
; Measures - HWiNFO Gadget (registry, no 12h shared memory limit)
; ===================================================================

[MeasureCpuTemp]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\HWiNFO64\VSB
RegValue=ValueRaw#HwCpuTemp#
MinValue=0
MaxValue=100

[MeasureCpuPower]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\HWiNFO64\VSB
RegValue=ValueRaw#HwCpuPower#

[MeasureGpuLoad]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\HWiNFO64\VSB
RegValue=ValueRaw#HwGpuLoad#
MinValue=0
MaxValue=100

[MeasureGpuTemp]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\HWiNFO64\VSB
RegValue=ValueRaw#HwGpuTemp#
MinValue=0
MaxValue=100

[MeasureGpuPower]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\HWiNFO64\VSB
RegValue=ValueRaw#HwGpuPower#

; HWiNFO reports "GPU Memory Usage" as a percentage
[MeasureGpuVramPct]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\HWiNFO64\VSB
RegValue=ValueRaw#HwGpuVram#

[MeasureGpuVramGb]
Measure=Calc
Formula=MeasureGpuVramPct * #GpuVramTotalGb# / 100

; ===================================================================
; Styles
; ===================================================================

[StyleLabel]
X=#PadX#
FontFace=#FontFace#
FontSize=20
FontWeight=600
FontColor=#ColorDim#
AntiAlias=1

[StyleBig]
X=#PadX#
FontFace=#FontFace#
FontSize=96
FontWeight=300
FontColor=#ColorText#
AntiAlias=1

[StyleMedium]
X=#PadX#
FontFace=#FontFace#
FontSize=44
FontWeight=300
FontColor=#ColorText#
AntiAlias=1

[StyleSideLabel]
X=(#PadX#+#ContentW#)
StringAlign=Right
FontFace=#FontFace#
FontSize=16
FontWeight=600
FontColor=#ColorDim#
AntiAlias=1

[StyleSideValue]
X=(#PadX#+#ContentW#)
StringAlign=Right
FontFace=#FontFace#
FontSize=32
FontColor=#ColorText#
AntiAlias=1
DynamicVariables=1

[StyleSmall]
X=#PadX#
FontFace=#FontFace#
FontSize=20
FontColor=#ColorText#
AntiAlias=1

; ===================================================================
; Background
; ===================================================================

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#ScreenW#,#ScreenH# | Fill Color #ColorBg# | StrokeWidth 0
; Double tap anywhere on the background reloads the skin
LeftMouseDoubleClickAction=[!Refresh]

; ===================================================================
; Clock
; ===================================================================

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=(#ScreenW#/2)
Y=#ClockY#
StringAlign=Center
FontFace=#FontFace#
FontSize=150
FontWeight=200
FontColor=#ColorText#
AntiAlias=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=(#ScreenW#/2)
Y=(#ClockY#+265)
StringAlign=Center
StringCase=Upper
FontFace=#FontFace#
FontSize=26
FontWeight=600
FontColor=#ColorDim#
AntiAlias=1

; ===================================================================
; CPU card (tap opens Task Manager)
; ===================================================================

[MeterCpuCard]
Meter=Shape
X=20
Y=(#CpuY#-30)
Shape=Rectangle 0,0,642,330,18 | Fill Color #ColorCard# | StrokeWidth 0
Shape2=Rectangle 0,0,6,330,3 | Fill Color #ColorCpu# | StrokeWidth 0
LeftMouseUpAction=["taskmgr.exe"]

[MeterCpuLabel]
Meter=String
MeterStyle=StyleLabel
Y=#CpuY#
Text=CPU

[MeterCpuLoad]
Meter=String
MeterStyle=StyleBig
MeasureName=MeasureCpu
Y=(#CpuY#+30)
NumOfDecimals=0
Text=%1%

[MeterCpuTempLabel]
Meter=String
MeterStyle=StyleSideLabel
Y=(#CpuY#+10)
Text=TEMP

[MeterCpuTemp]
Meter=String
MeterStyle=StyleSideValue
Y=(#CpuY#+34)
Text=[MeasureCpuTemp:0][\x00B0]C

[MeterCpuPowerLabel]
Meter=String
MeterStyle=StyleSideLabel
Y=(#CpuY#+110)
Text=POWER

[MeterCpuPower]
Meter=String
MeterStyle=StyleSideValue
Y=(#CpuY#+134)
Text=[MeasureCpuPower:0] W

[MeterCpuBar]
Meter=Shape
X=#PadX#
Y=(#CpuY#+240)
Shape=Rectangle 0,0,#ContentW#,#BarH#,(#BarH#/2) | Fill Color #ColorTrack# | StrokeWidth 0
Shape2=Rectangle 0,0,(max(#ContentW#*[MeasureCpu:%]/100,#BarH#)),#BarH#,(#BarH#/2) | Fill Color #ColorCpu# | StrokeWidth 0
DynamicVariables=1

; ===================================================================
; GPU card
; ===================================================================

[MeterGpuCard]
Meter=Shape
X=20
Y=(#GpuY#-30)
Shape=Rectangle 0,0,642,330,18 | Fill Color #ColorCard# | StrokeWidth 0
Shape2=Rectangle 0,0,6,330,3 | Fill Color #ColorGpu# | StrokeWidth 0

[MeterGpuLabel]
Meter=String
MeterStyle=StyleLabel
Y=#GpuY#
Text=GPU

[MeterGpuLoad]
Meter=String
MeterStyle=StyleBig
Y=(#GpuY#+30)
Text=[MeasureGpuLoad:0]%
DynamicVariables=1

[MeterGpuVram]
Meter=String
MeterStyle=StyleLabel
Y=(#GpuY#+180)
Text=VRAM  [MeasureGpuVramGb:1] / #GpuVramTotalGb# GB
DynamicVariables=1

[MeterGpuTempLabel]
Meter=String
MeterStyle=StyleSideLabel
Y=(#GpuY#+10)
Text=TEMP

[MeterGpuTemp]
Meter=String
MeterStyle=StyleSideValue
Y=(#GpuY#+34)
Text=[MeasureGpuTemp:0][\x00B0]C

[MeterGpuPowerLabel]
Meter=String
MeterStyle=StyleSideLabel
Y=(#GpuY#+110)
Text=POWER

[MeterGpuPower]
Meter=String
MeterStyle=StyleSideValue
Y=(#GpuY#+134)
Text=[MeasureGpuPower:0] W

[MeterGpuBar]
Meter=Shape
X=#PadX#
Y=(#GpuY#+240)
Shape=Rectangle 0,0,#ContentW#,#BarH#,(#BarH#/2) | Fill Color #ColorTrack# | StrokeWidth 0
Shape2=Rectangle 0,0,(max(#ContentW#*[MeasureGpuLoad:%]/100,#BarH#)),#BarH#,(#BarH#/2) | Fill Color #ColorGpu# | StrokeWidth 0
DynamicVariables=1

; ===================================================================
; Memory card
; ===================================================================

[MeterRamCard]
Meter=Shape
X=20
Y=(#RamY#-30)
Shape=Rectangle 0,0,642,230,18 | Fill Color #ColorCard# | StrokeWidth 0
Shape2=Rectangle 0,0,6,230,3 | Fill Color #ColorRam# | StrokeWidth 0

[MeterRamLabel]
Meter=String
MeterStyle=StyleLabel
Y=#RamY#
Text=MEMORY

[MeterRamUsed]
Meter=String
MeterStyle=StyleMedium
MeasureName=MeasureRamUsed
Y=(#RamY#+40)
AutoScale=1
NumOfDecimals=1
Text=%1B

[MeterRamTotal]
Meter=String
MeterStyle=StyleSideValue
MeasureName=MeasureRamTotal
Y=(#RamY#+56)
FontColor=#ColorDim#
AutoScale=1
NumOfDecimals=0
Text=of %1B

[MeterRamBar]
Meter=Shape
X=#PadX#
Y=(#RamY#+150)
Shape=Rectangle 0,0,#ContentW#,#BarH#,(#BarH#/2) | Fill Color #ColorTrack# | StrokeWidth 0
Shape2=Rectangle 0,0,(max(#ContentW#*[MeasureRamUsed:%]/100,#BarH#)),#BarH#,(#BarH#/2) | Fill Color #ColorRam# | StrokeWidth 0
DynamicVariables=1

; ===================================================================
; Network card
; ===================================================================

[MeterNetCard]
Meter=Shape
X=20
Y=(#NetY#-30)
Shape=Rectangle 0,0,642,230,18 | Fill Color #ColorCard# | StrokeWidth 0
Shape2=Rectangle 0,0,6,230,3 | Fill Color #ColorNet# | StrokeWidth 0

[MeterNetLabel]
Meter=String
MeterStyle=StyleLabel
Y=#NetY#
Text=NETWORK

[MeterNetInLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#NetY#+60)
FontColor=#ColorNet#
Text=DOWN

[MeterNetIn]
Meter=String
MeterStyle=StyleSideValue
MeasureName=MeasureNetIn
Y=(#NetY#+46)
; Start at kilo so idle traffic reads "0.7 kB/s" instead of "692.0 B/s"
AutoScale=1k
NumOfDecimals=1
Text=%1B/s

[MeterNetOutLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#NetY#+130)
FontColor=#ColorNet#
Text=UP

[MeterNetOut]
Meter=String
MeterStyle=StyleSideValue
MeasureName=MeasureNetOut
Y=(#NetY#+116)
AutoScale=1k
NumOfDecimals=1
Text=%1B/s

; ===================================================================
; Storage card
; ===================================================================

[MeterDiskCard]
Meter=Shape
X=20
Y=(#DiskY#-30)
Shape=Rectangle 0,0,642,280,18 | Fill Color #ColorCard# | StrokeWidth 0
Shape2=Rectangle 0,0,6,280,3 | Fill Color #ColorDisk# | StrokeWidth 0

[MeterDiskLabel]
Meter=String
MeterStyle=StyleLabel
Y=#DiskY#
Text=STORAGE

[MeterDisk1Text]
Meter=String
MeterStyle=StyleSmall
MeasureName=MeasureDisk1Used
MeasureName2=MeasureDisk1Total
Y=(#DiskY#+50)
AutoScale=1
NumOfDecimals=1
Text=#Drive1#   %1B / %2B

[MeterDisk1Bar]
Meter=Shape
X=#PadX#
Y=(#DiskY#+95)
Shape=Rectangle 0,0,#ContentW#,#BarH#,(#BarH#/2) | Fill Color #ColorTrack# | StrokeWidth 0
Shape2=Rectangle 0,0,(max(#ContentW#*[MeasureDisk1Used:%]/100,#BarH#)),#BarH#,(#BarH#/2) | Fill Color #ColorDisk# | StrokeWidth 0
DynamicVariables=1

[MeterDisk2Text]
Meter=String
MeterStyle=StyleSmall
MeasureName=MeasureDisk2Used
MeasureName2=MeasureDisk2Total
Y=(#DiskY#+140)
AutoScale=1
NumOfDecimals=1
Text=#Drive2#   %1B / %2B

[MeterDisk2Bar]
Meter=Shape
X=#PadX#
Y=(#DiskY#+185)
Shape=Rectangle 0,0,#ContentW#,#BarH#,(#BarH#/2) | Fill Color #ColorTrack# | StrokeWidth 0
Shape2=Rectangle 0,0,(max(#ContentW#*[MeasureDisk2Used:%]/100,#BarH#)),#BarH#,(#BarH#/2) | Fill Color #ColorDisk# | StrokeWidth 0
DynamicVariables=1

; ===================================================================
; Load history (CPU + GPU, ~10 minutes at 1 point per second)
; ===================================================================

[MeterHistoryCard]
Meter=Shape
X=20
Y=(#HistoryY#-30)
Shape=Rectangle 0,0,642,320,18 | Fill Color #ColorCard# | StrokeWidth 0

[MeterHistoryLabel]
Meter=String
MeterStyle=StyleLabel
Y=#HistoryY#
Text=LOAD HISTORY

[MeterHistory]
Meter=Line
MeasureName=MeasureCpu
MeasureName2=MeasureGpuLoad
LineCount=2
LineColor=#ColorCpu#
LineColor2=#ColorGpu#
LineWidth=2
X=#PadX#
Y=(#HistoryY#+45)
W=#ContentW#
H=230
AntiAlias=1

; ===================================================================
; Footer
; ===================================================================

[MeterUptime]
Meter=String
MeasureName=MeasureUptime
X=(#ScreenW#/2)
Y=#FooterY#
StringAlign=Center
FontFace=#FontFace#
FontSize=18
FontWeight=600
FontColor=#ColorDim#
AntiAlias=1
Text=UPTIME  %1
